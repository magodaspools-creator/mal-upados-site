name: Atualizar historico

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    paths:
      - "atualizar_historico.py"
      - ".github/workflows/atualizar.yml"

concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar script
        run: python -m py_compile atualizar_historico.py

      - name: Atualizar historico
        run: python atualizar_historico.py

      - name: Publicar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json historico_xp.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no historico."
            exit 0
          fi
          git commit -m "atualiza historico de level e XP"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
