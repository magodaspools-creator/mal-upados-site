name: Atualizar historico
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python atualizar_historico.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add historico.json
          git commit -m "atualiza historico" || echo "nada novo"
          git push
