name: Atualizar historico
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "atualizar_historico.py"
      - ".github/workflows/atualizar.yml"
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python atualizar_historico.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add historico.json historico_xp.json
          git commit -m "atualiza historico de level e XP" || echo "nada novo"
          git push
