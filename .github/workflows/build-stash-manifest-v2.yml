name: Build Stash Sprite Manifest v3

on:
  push:
    paths:
      - 'tools/build-remote-stash-manifest-v2.py'
      - '.github/workflows/build-stash-manifest-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install requests pillow

      - name: Build manifest
        run: python tools/build-remote-stash-manifest-v2.py

      - name: Publish manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stash-sprites/manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest sem alterações.'
            exit 0
          fi
          git commit -m 'chore(stash): refresh full sprite manifest'
          git push
