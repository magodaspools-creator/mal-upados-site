name: Sincronizar menu e rodape globais

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Garantir Stash em todas as paginas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in sorted(Path('.').glob('*.html')):
              if path.name.startswith('_'):
                  continue
              text = path.read_text(encoding='utf-8')

              # Menu global: garante o link Stash sem duplicar.
              def sync_menu(m):
                  links = m.group(1)
                  if re.search(r'href=["\']stash\.html["\']', links):
                      return m.group(0)
                  anchor = '<a href="stash.html">Stash</a>'
                  return '<div class="links">' + links + anchor + '</div>'

              text = re.sub(r'<div class="links">(.*?)</div>', sync_menu, text, count=1, flags=re.S)

              # Rodape global: garante o link Stash sem duplicar.
              def sync_footer(m):
                  body = m.group(1)
                  if re.search(r'href=["\']stash\.html["\']', body):
                      return m.group(0)
                  return '<footer>' + body.rstrip() + ' · <a href="stash.html">Stash</a></footer>'

              text = re.sub(r'<footer>(.*?)</footer>', sync_footer, text, count=1, flags=re.S)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit se houver alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Menu e rodape ja estao sincronizados."
          else
            git commit -m "Sincronizar menu e rodape globais [skip ci]"
            git push
          fi
