name: Sincronizar menu e rodape globais

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Coletar XP real
        run: python3 atualizar_historico.py

      - name: Padronizar menu e rodape em todas as paginas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          NAV = [
              ('index.html', 'Início'),
              ('ranking.html', 'Ranking'),
              ('guilda.html', 'Guilda'),
              ('stash.html', 'Stash'),
              ('hunting.html', 'Guia de Hunts'),
              ('arena.html', 'Arena'),
              ('caos.html', 'Caos'),
          ]

          def nav_html(current, active=True):
              items = []
              for href, label in NAV:
                  cls = ' class="active"' if active and href == current else ''
                  items.append(f'<a{cls} href="{href}">{label}</a>')
              return ''.join(items)

          for path in sorted(Path('.').glob('*.html')):
              if path.name.startswith('_'):
                  continue

              text = path.read_text(encoding='utf-8')
              menu = '<div class="links">' + nav_html(path.name) + '</div>'
              text, menu_count = re.subn(
                  r'<div class="links">.*?</div>',
                  menu,
                  text,
                  count=1,
                  flags=re.S,
              )

              if menu_count == 0:
                  text = re.sub(
                      r'(<header[^>]*>.*?<div class="nav">.*?</div>)',
                      lambda m: m.group(1).replace('</div>', menu + '</div>', 1),
                      text,
                      count=1,
                      flags=re.S,
                  )

              footer = '<footer>Mal Upados · Jadebra · ' + ' · '.join(
                  f'<a href="{href}">{label}</a>' for href, label in NAV
              ) + '</footer>'

              text, footer_count = re.subn(
                  r'<footer>.*?</footer>',
                  footer,
                  text,
                  count=1,
                  flags=re.S,
              )

              if footer_count == 0:
                  text = text.replace('</body>', footer + '</body>', 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit se houver alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' historico.json historico_xp.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao."
          else
            git commit -m "Atualizar historico e padronizar navegacao [skip ci]"
            git push
          fi
