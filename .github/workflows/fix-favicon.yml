name: Fix favicon on all pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar historico de XP e level
        run: python3 atualizar_historico.py
      - name: Normalize favicon on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              s=re.sub(r'<link[^>]+rel=["\'](?:icon|shortcut icon)["\'][^>]*>', '', s, flags=re.I)
              marker='<meta name="viewport"'
              pos=s.find('>', s.find(marker))
              if pos >= 0:
                  favicon=f'<link rel="icon" type="image/jpeg" href="guilda.jpg?v=4-{p.stem}">'
                  s=s[:pos+1]+favicon+s[pos+1:]
              p.write_text(s)
          PY
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' historico.json historico_xp.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar historico e favicon"
          git push
