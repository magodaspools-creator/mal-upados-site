name: Fix favicon on all pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'guilda.jpg'
      - '.github/workflows/fix-favicon.yml'

permissions:
  contents: write

concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  fix-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Normalize favicon on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(
                  r'<link[^>]+rel=["\'](?:icon|shortcut icon)["\'][^>]*>',
                  '',
                  s,
                  flags=re.I,
              )
              marker = '<meta name="viewport"'
              marker_pos = s.find(marker)
              pos = s.find('>', marker_pos) if marker_pos >= 0 else -1
              if pos >= 0:
                  favicon = (
                      f'<link rel="icon" type="image/jpeg" '
                      f'href="/guilda.jpg?v=5-{p.stem}">'
                  )
                  s = s[:pos + 1] + favicon + s[pos + 1:]
              p.write_text(s, encoding='utf-8')

          PY

      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de favicon."
            exit 0
          fi
          git commit -m "chore: normalizar favicon das paginas"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
