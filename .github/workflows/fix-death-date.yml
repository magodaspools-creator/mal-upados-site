name: Fix death date

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix guild death parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('guilda.html')
          s = p.read_text()

          old_raw = "function deathRaw(v){return String(v?.date?.date||v?.date||'').trim()}"
          new_raw = """function deathRaw(v){let seen=new Set();function find(x,d=0){if(x==null||d>6)return'';if(typeof x==='string')return/\\d{4}-\\d{2}-\\d{2}/.test(x)?x:'';if(typeof x!=='object'||seen.has(x))return'';seen.add(x);for(let k of ['date','datetime','timestamp','time','death_date']){let r=find(x[k],d+1);if(r)return r}for(let k of Object.keys(x)){let r=find(x[k],d+1);if(r)return r}return''}return find(v).trim()}"""
          if old_raw not in s:
              raise SystemExit('deathRaw target not found')
          s = s.replace(old_raw, new_raw, 1)

          old_load = """let c=j.character||j.characters?.data||j.characters||{};deaths[m.name]=Array.isArray(c.deaths)?c.deaths:(Array.isArray(j.deaths)?j.deaths:(Array.isArray(j.characters?.deaths)?j.characters.deaths:[]))"""
          new_load = """let c=j.character||j.characters?.data||j.characters||{};deaths[m.name]=Array.isArray(c.deaths)?c.deaths:(Array.isArray(j.character?.character?.deaths)?j.character.character.deaths:(Array.isArray(j.characters?.deaths)?j.characters.deaths:(Array.isArray(j.characters?.data?.deaths)?j.characters.data.deaths:(Array.isArray(j.deaths)?j.deaths:[]))))"""
          if old_load not in s:
              raise SystemExit('loadDeaths target not found')
          s = s.replace(old_load, new_load, 1)

          p.write_text(s)
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guilda.html
          git rm .github/workflows/fix-death-date.yml
          git commit -m "fix: show real death dates"
          git push
