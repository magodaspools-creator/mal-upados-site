<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="guilda.jpg?v=4-ranking"><title>Ranking XP | Mal Upados</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="nav"><a class="brand" href="index.html">⛧ MAL UPADOS</a><div class="links"><a href="index.html">Início</a><a class="active" href="ranking.html">Ranking</a><a href="guilda.html">Guilda</a><a href="stash.html">Stash</a><a href="hunting.html">Guia de Hunts</a><a href="arena.html">Arena</a><a href="arena-sobreviva.html">Sobreviva</a><a href="caos.html">Caos</a></div></div></header><main><div class="hero"><div class="sigil">⚔</div><div class="eyebrow">Competição da guilda</div><h1>Ranking <span>XP</span></h1></div><section><div class="filters"><button class="btn active" data-days="1">Últimas 24 horas</button></div><div class="period" id="period">Calculando…</div><div class="podium" id="podium"></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Nome</th><th>XP feita nas últimas 24h</th></tr></thead><tbody id="body"></tbody></table></div></section></main><footer>Mal Upados · Jadebra · <a href="index.html">Início</a> · <a href="ranking.html">Ranking</a> · <a href="guilda.html">Guilda</a> · <a href="stash.html">Stash</a> · <a href="hunting.html">Guia de Hunts</a> · <a href="arena.html">Arena</a> · <a href="caos.html">Caos</a></footer><script>
function fmt(n){return new Intl.NumberFormat('pt-BR').format(Math.round(n))}
function signed(n){return (n>=0?'+':'')+fmt(n)}
function esc(v){return String(v??'').replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',"'":'&#39;'}[c]))}
let history={};

async function load(){
  try{
    let r=await fetch('historico_xp.json?'+Date.now());
    if(!r.ok)throw Error();
    history=await r.json();
    render();
  }catch(e){
    document.getElementById('period').textContent='Histórico de XP indisponível.'
  }
}

function xpOf(date,name){
  let v=(history[date]||{})[name];
  if(!v||v.experience_exact!==true||typeof v.experience!=='number')return null;
  return v.experience;
}

function render(){
  let ds=Object.keys(history).sort();
  if(ds.length<2){
    document.getElementById('period').textContent='Aguardando duas coletas reais de XP para calcular as últimas 24 horas.';
    document.getElementById('body').innerHTML='<tr><td colspan="3">Ainda não há duas coletas reais de XP.</td></tr>';
    document.getElementById('podium').innerHTML='';
    return;
  }

  let end=ds.at(-1);
  let previous=ds.at(-2);
  let endDate=new Date(end+'T00:00:00Z');
  let previousDate=new Date(previous+'T00:00:00Z');
  let hours=(endDate-previousDate)/3600000;

  if(hours!==24){
    document.getElementById('period').innerHTML='<strong>XP das últimas 24 horas:</strong> aguardando duas coletas consecutivas de 24h.';
    document.getElementById('body').innerHTML='<tr><td colspan="3">Não há um intervalo de exatamente 24 horas disponível.</td></tr>';
    document.getElementById('podium').innerHTML='';
    return;
  }

  let names=new Set([
    ...Object.keys(history[previous]||{}),
    ...Object.keys(history[end]||{})
  ]);

  let rows=[...names].map(name=>{
    let initial=xpOf(previous,name);
    let current=xpOf(end,name);
    if(initial===null||current===null)return null;
    return {name,gain:current-initial};
  }).filter(Boolean).sort((a,b)=>b.gain-a.gain||a.name.localeCompare(b.name));

  document.getElementById('period').innerHTML='<strong>Período:</strong> últimas 24 horas · '+previous+' → '+end+' · somente XP ganha no intervalo';

  document.getElementById('body').innerHTML=rows.map((x,i)=>
    '<tr><td class="rank">'+(i+1)+'</td><td><strong>'+esc(x.name)+'</strong></td><td class="xp">'+signed(x.gain)+' XP</td></tr>'
  ).join('')||'<tr><td colspan="3">Nenhum jogador possui duas coletas reais de XP no intervalo.</td></tr>';

  let top=rows.slice(0,3),slots=[top[1],top[0],top[2]];
  document.getElementById('podium').innerHTML=slots.filter(Boolean).map((x,i)=>
    '<div class="'+(i===1?'first':'')+'"><div class="pplace">'+['2º','1º','3º'][i]+'</div><div class="pname">'+esc(x.name)+'</div><div class="xp">'+signed(x.gain)+' XP</div><div class="small">XP ganha nas últimas 24h</div></div>'
  ).join('');
}

document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>render());
load();
</script><script src="site-auth.js?v=global-account-20260914"></script></body></html><script src="site-auth.js?v=global-account-20260914"></script></body></html>
